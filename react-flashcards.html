<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive AWS study flashcards.">
  <title>React Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#172033; --muted:#677087; --paper:#fff; --line:#dfe4ed; --orange:#61dafb; --navy:#20232a; --blue:#087ea4; --green:#16835f; --red:#c24b4b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Manrope,sans-serif; background:radial-gradient(circle at 8% 12%,#e3f9ff 0,transparent 28%),radial-gradient(circle at 90% 80%,#e1efff 0,transparent 30%),#f5f7fb; }
    button { font:inherit; }
    .topbar { height:68px; padding:0 max(22px,5vw); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(23,32,51,.1); background:rgba(255,255,255,.82); backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-weight:800; text-decoration:none; }
    .mark { width:34px; height:34px; display:grid; place-items:center; border-radius:9px; color:white; background:var(--navy); box-shadow:inset 0 -4px 0 var(--orange); }
    .back { color:var(--muted); font-size:.9rem; text-decoration:none; }
    main { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:54px 0 70px; }
    .eyebrow { margin:0 0 8px; color:#b56b00; font:500 .76rem DM Mono,monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(2.4rem,7vw,4.8rem)/.95 Newsreader,serif; letter-spacing:-.04em; }
    .intro { margin:14px 0 30px; color:var(--muted); }
    .status { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:12px; color:var(--muted); font-size:.88rem; }
    .progress-track { height:7px; overflow:hidden; border-radius:99px; background:#e1e6ef; }
    .progress { height:100%; width:0; background:linear-gradient(90deg,var(--orange),#ffbd4d); transition:width .25s; }
    .card-wrap { perspective:1400px; margin:22px 0; }
    .card { width:100%; height:360px; position:relative; border:0; padding:0; cursor:pointer; background:transparent; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.75,.25,1); }
    .card.flipped { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; padding:clamp(28px,6vw,64px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; backface-visibility:hidden; border:1px solid var(--line); border-radius:28px; background:var(--paper); box-shadow:0 24px 70px rgba(37,50,75,.12); }
    .back-face { transform:rotateY(180deg); background:linear-gradient(145deg,#162b47,#223f65); color:white; border-color:#29486f; }
    .label { position:absolute; top:24px; font:500 .72rem DM Mono,monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--blue); }
    .back-face .label { color:#ffbd4d; }
    .face p { margin:0; max-width:720px; font:600 clamp(1.3rem,3.4vw,2rem)/1.38 Manrope,sans-serif; }
    .hint { position:absolute; bottom:20px; color:#8a93a6; font-size:.75rem; }
    .back-face .hint { color:#b8c8db; }
    .controls { display:grid; grid-template-columns:1fr auto auto 1fr; gap:10px; }
    .control { min-height:48px; padding:10px 18px; border:1px solid var(--line); border-radius:13px; color:var(--ink); background:white; cursor:pointer; font-weight:700; }
    .control:hover { border-color:#aeb8c8; transform:translateY(-1px); }
    .control.primary { color:white; border-color:var(--navy); background:var(--navy); }
    .study-actions { display:flex; justify-content:center; gap:10px; margin-top:12px; }
    .study-actions button { min-width:145px; }
    .review { color:var(--red); }
    .known { color:var(--green); }
    .footer-note { margin-top:28px; text-align:center; color:var(--muted); font-size:.78rem; }
    @media (max-width:620px) { main{padding-top:36px}.card{height:390px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1;grid-row:1}.study-actions button{min-width:0;flex:1}.topbar{padding:0 18px} }
    @media (prefers-reduced-motion:reduce) { *{scroll-behavior:auto!important}.card{transition:none} }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="mark">R</span><span>React Study Deck</span></a>
    <a class="back" href="index.html">← Back to library</a>
  </header>
  <main>
    <p class="eyebrow">Frontend development revision</p>
    <h1>React flashcards</h1>
    <p class="intro">Flip each card to reveal the answer, then mark what you know. Your progress stays in this browser.</p>
    <div class="status"><span id="counter">Card 1 of 90</span><span id="score">0 known · 0 review</span></div>
    <div class="progress-track" aria-label="Deck progress"><div class="progress" id="progress"></div></div>
    <div class="card-wrap">
      <button class="card" id="card" type="button" aria-label="Flip flashcard" aria-live="polite">
        <span class="face front-face"><span class="label">Question</span><p id="question"></p><span class="hint">Click or press Space to reveal</span></span>
        <span class="face back-face"><span class="label">Answer</span><p id="answer"></p><span class="hint">Click or press Space to return</span></span>
      </button>
    </div>
    <div class="controls">
      <button class="control" id="previous" type="button">← Previous</button>
      <button class="control" id="shuffle" type="button">Shuffle</button>
      <button class="control" id="reset" type="button">Reset</button>
      <button class="control primary" id="next" type="button">Next →</button>
    </div>
    <div class="study-actions">
      <button class="control review" id="review" type="button">Needs review</button>
      <button class="control known" id="known" type="button">I know this</button>
    </div>
    <p class="footer-note">Keyboard: ← previous · → next · Space flip · 1 review · 2 known</p>
  </main>

  <script id="deck-data" type="application/json"></script>
  <script>
    const cards = [
          [
                "Which tool allows developers to execute the Create React App code without first downloading the project permanently?",
                "npx"
          ],
          [
                "What is the primary function of the node_modules/ directory in a React project?",
                "It contains all the external JavaScript libraries used by the application."
          ],
          [
                "Which file in the public/ directory serves as the single HTML root where React injects its code?",
                "index.html"
          ],
          [
                "What is the role of the package-lock.json file in a Node.js project?",
                "It ensures that packages match exact versions so that all developers have identical dependencies."
          ],
          [
                "How does the 'build' script in Create React App optimize the project for deployment?",
                "It compiles and minifies the code into a small, usable bundle that occupies less space."
          ],
          [
                "Which testing runner is automatically initialized by the 'test' script in a Create React App project?",
                "Jest"
          ],
          [
                "What is the permanent consequence of running the 'npm run eject' command?",
                "It copies all dependencies and configuration files into the project and removes the project from the integrated toolchain."
          ],
          [
                "By default, on which port does the Create React App development server run?",
                "3000"
          ],
          [
                "What is the mandatory structural requirement when returning multiple JSX elements from a component?",
                "They must be wrapped in a single top-level element or a fragment."
          ],
          [
                "Why must developers use 'className' instead of 'class' when defining CSS classes in JSX?",
                "'class' is a reserved keyword in JavaScript."
          ],
          [
                "In JSX, which symbol is used to wrap JavaScript expressions to evaluate them within markup?",
                "Curly braces {}"
          ],
          [
                "What naming convention must be followed for React components to be recognized as components instead of HTML elements?",
                "They must start with a capital letter."
          ],
          [
                "In the context of React, what are 'props'?",
                "Arguments provided to a JSX element used to display data or make components interactive."
          ],
          [
                "What is the fundamental difference between 'props' and 'state' regarding mutability?",
                "Props are read-only and passed from parents, whereas state is managed internally and changes over time."
          ],
          [
                "Which specific prop allows components to capture and render content nested between their opening and closing tags?",
                "children"
          ],
          [
                "How are class-based components created in React?",
                "By declaring a JavaScript class that extends the base React.Component class."
          ],
          [
                "What is the primary method used in class components to return the JSX that defines the UI?",
                "render()"
          ],
          [
                "What functionality do React Hooks provide to functional components?",
                "They allow functional components to manage state and tap into the React lifecycle."
          ],
          [
                "What are the two items returned in the array by the useState Hook?",
                "A variable containing the current state and a function to update that state."
          ],
          [
                "When updating state based on its current value, what should be passed to the state-setting function to ensure the most up-to-date state is used?",
                "A function that takes the previous state as an argument and returns the new value."
          ],
          [
                "What two arguments are required to initialize the useReducer Hook?",
                "A reducer function and the initial state data."
          ],
          [
                "In a reducer function, what are the two standard arguments provided by React?",
                "The current state and the action object."
          ],
          [
                "What is the primary purpose of the React Context API?",
                "To share data across multiple components without manually passing props through every level of the tree."
          ],
          [
                "Which component in the Context API is responsible for holding and broadcasting the data to nested components?",
                "The Provider"
          ],
          [
                "What is a SyntheticEvent in React?",
                "A cross-browser wrapper around the browser's native event used to ensure consistent behavior."
          ],
          [
                "How can a developer prevent a form from performing a full page reload upon submission in a React SPA?",
                "By calling e.preventDefault() within the submit event handler."
          ],
          [
                "What does the useEffect Hook do in a functional component?",
                "It performs side effects in response to component renders or specific dependency changes."
          ],
          [
                "How is a useEffect Hook configured to run only once after the initial component mount?",
                "By passing an empty array [] as the second argument."
          ],
          [
                "What is the purpose of the return value in the function passed to useEffect?",
                "It serves as a cleanup function that runs before the component unmounts or before the effect re-runs."
          ],
          [
                "Which property of the object returned by useRef is used to access or modify the persisted value?",
                "current"
          ],
          [
                "What is the primary advantage of useRef over useState for storing values?",
                "Updating a ref does not trigger a component re-render."
          ],
          [
                "Which tab in the React Developer Tools extension is used to inspect the component hierarchy and its props/state?",
                "The Components tab"
          ],
          [
                "What is the purpose of the Profiler tab in React Developer Tools?",
                "It records interactions to measure the performance and rendering frequency of components."
          ],
          [
                "In JSX, what is the 'key' prop used for when mapping over an array of data?",
                "It provides a unique identifier for React to track elements and optimize DOM updates."
          ],
          [
                "Why is it important not to directly mutate the state array when adding an item in a functional component?",
                "Direct mutation does not trigger a re-render and can cause bugs; state must be replaced with a new copy."
          ],
          [
                "What is 'short-circuit evaluation' in the context of JSX conditional rendering?",
                "Using the logical AND operator (&&) to render an element only if a condition is true."
          ],
          [
                "In CSS files imported into React components, what is the 'separating concerns' philosophy described by Morgan?",
                "Grouping related CSS, JavaScript, and markup together as a single component instead of separating by technology."
          ],
          [
                "What does the 'npm start' command do in a local environment?",
                "It starts a local server, opens the project in a browser, and watches for code changes to trigger hot reloading."
          ],
          [
                "What command is used to securely copy a build directory to a remote server via the terminal?",
                "scp -r"
          ],
          [
                "What is the benefit of deploying a React application to DigitalOcean App Platform's Starter tier?",
                "It allows for free deployment of static sites with automatic builds on every GitHub push."
          ],
          [
                "Why are filenames in the build/ directory suffixed with a unique hash?",
                "To ensure that the browser identifies the file as new and avoids using a cached version of the code."
          ],
          [
                "Which React Hook is specifically designed to persist a variable for the entire lifetime of a component?",
                "useRef"
          ],
          [
                "What is the defining characteristic of a 'Wrapper Component' in React?",
                "It surrounds unknown children to provide a consistent default structure or style."
          ],
          [
                "How can developers use JavaScript within JSX to create multiple elements from a data array?",
                "By using the array .map() method to return a JSX element for each item."
          ],
          [
                "Which keyword is required when importing React to allow the conversion of JSX into standard JavaScript?",
                "import React from 'react'"
          ],
          [
                "What happens to the 'key' prop in the final compiled HTML sent to the browser?",
                "It is stripped out as it is only used for React's internal bookkeeping."
          ],
          [
                "Under what condition does a functional component re-render when using Hooks?",
                "When its state variables or props are updated."
          ],
          [
                "In Redux, what is the 'single source of truth' principle?",
                "The practice of storing all application data in one centralized store that flows in one direction."
          ],
          [
                "Which tool in the React ecosystem is used to handle navigation and routing without full page reloads?",
                "React Router"
          ],
          [
                "What is a 'custom Hook' in React development?",
                "A function that wraps built-in Hooks to extract component logic into a reusable piece of code."
          ],
          [
                "What naming convention must all custom Hooks follow to be recognized by the linter?",
                "They must start with the prefix 'use'."
          ],
          [
                "Why is the useReducer Hook often preferred over useState for complex state logic?",
                "It keeps the component code cleaner by moving complex update logic into an external reducer function."
          ],
          [
                "What role does Nginx play when deploying a React application on Ubuntu?",
                "It acts as the web server that serves the static files from the build directory to users."
          ],
          [
                "In the DigitalOcean App Platform, why is a React app classified as a 'Static Site'?",
                "The server only serves pre-built assets and does not need to execute server-side application code like Ruby or PHP."
          ],
          [
                "How does 'hot reloading' benefit the developer during the 'npm start' process?",
                "It instantly refreshes the browser page as soon as changes are saved in the source code."
          ],
          [
                "Which method in functional components is used to trigger an action when a component is about to be removed from the DOM?",
                "The cleanup function returned by useEffect."
          ],
          [
                "What is the purpose of the 'robots.txt' file in the public/ directory?",
                "It provides instructions to web crawlers about which pages they are allowed to index."
          ],
          [
                "What is the 'manifest.json' file used for in a React project?",
                "It provides metadata describing the application, such as icons for different device screen sizes."
          ],
          [
                "In a functional component, what occurs if the dependency array of useEffect is omitted entirely?",
                "The effect runs after every single render of the component."
          ],
          [
                "How can props be passed into a component to make them easier to reference without the 'props.' prefix?",
                "By using object destructuring in the function signature."
          ],
          [
                "What is the primary function of the 'src/index.js' file in a Create React App project?",
                "It acts as the entry point that renders the root App component into the index.html DOM element."
          ],
          [
                "Which command-line flag ensures that 'ls' output includes hidden files like .gitignore?",
                "-a"
          ],
          [
                "What is the specific JSX attribute used to associate a label element with an input id?",
                "htmlFor"
          ],
          [
                "Why are functional components generally considered more readable than class components?",
                "They are shorter and allow stateful logic to be easily shared via Hooks without complex inheritance."
          ],
          [
                "How does React determine if a custom component should be re-rendered based on props?",
                "It performs a shallow comparison of the new props versus the old props."
          ],
          [
                "What is the 'spread operator' used for when updating an array in state?",
                "To create a shallow copy of the existing array before appending or modifying values."
          ],
          [
                "What is the purpose of the 'aria-label' attribute in JSX?",
                "To provide an accessible text label for elements that accessibility software can read."
          ],
          [
                "In the context of React styling, what does it mean that Create React App is 'unopinionated'?",
                "It provides a basic CSS environment but allows developers to add their own preprocessors or libraries."
          ],
          [
                "Which JavaScript package manager is supported by Facebook and serves as an alternative to npm?",
                "yarn"
          ],
          [
                "What happens if React tries to render a component into a DOM id that does not exist in index.html?",
                "An error message stating 'Target container is not a DOM element' will appear."
          ],
          [
                "How does React handle passing attributes that are not strings or numbers in JSX?",
                "They must be passed inside curly braces so React treats them as JavaScript."
          ],
          [
                "What is the consequence of importing a CSS file into a React component?",
                "Webpack includes that CSS code in the final compiled bundle for the application."
          ],
          [
                "In a React project structure, what is the purpose of the src/ directory?",
                "It contains the React JavaScript code and assets where most of the development work occurs."
          ],
          [
                "Which class component lifecycle method is currently not available in React Hooks?",
                "componentDidCatch"
          ],
          [
                "What is 'Continuous Delivery' in the context of DigitalOcean App Platform?",
                "The automated process where every code change pushed to a repository triggers a new build and deployment."
          ],
          [
                "In a scp command, what does the '*' wildcard represent?",
                "It specifies that all files within the source directory should be copied."
          ],
          [
                "How does the 'eject' script give developers full control over their project?",
                "It exposes the underlying build and compilation configurations, such as Webpack and Babel."
          ],
          [
                "What is the role of the 'favicon.ico' file in the public/ directory?",
                "It is the icon that appears in the browser tab for the website."
          ],
          [
                "Why is it recommended to capitalize component filenames in React?",
                "It follows a community convention that helps distinguish components from standard JavaScript files."
          ],
          [
                "In the context of the useReducer Hook, what is 'dispatch'?",
                "The function used to send an action to the reducer to trigger a state update."
          ],
          [
                "What is the significance of the 'root' div in index.html?",
                "It is the mounting point where the entire React application is injected into the DOM."
          ],
          [
                "What occurs if a developer attempts to use more than one instance of the 'children' prop in a component?",
                "It is not possible because 'children' is a single prop representing the nested content."
          ],
          [
                "How can you pass custom JSX to multiple locations within a wrapper component if 'children' is insufficient?",
                "By passing JSX or other React components as named props."
          ],
          [
                "Which Hook should be used to store data that needs to be accessed by many deeply nested components?",
                "useContext"
          ],
          [
                "What does 'lifting state up' refer to in React development?",
                "Moving state to a common ancestor component so it can be shared between siblings via props."
          ],
          [
                "In a functional component, when does the cleanup function of useEffect execute relative to the next render?",
                "It runs immediately before the effect is re-executed on the next render."
          ],
          [
                "What is the purpose of the 'build/static/media' directory?",
                "It contains processed and uniquely named versions of images and other media assets."
          ],
          [
                "How does React prevent memory leaks related to global event listeners in functional components?",
                "By removing the event listener in the cleanup function of the useEffect Hook."
          ],
          [
                "What defines a 'Controlled Component' in a React form?",
                "A component where form data is handled by the React state instead of the DOM."
          ],
          [
                "In DigitalOcean App Platform, what is the 'Starter' tier primarily used for?",
                "Deploying static sites with no backend at no cost."
          ]
    ];

    let order = cards.map((_, index) => index);
    let position = 0;
    const results = JSON.parse(localStorage.getItem('react-flashcard-progress') || '{}');
    const card = document.querySelector('#card');
    const question = document.querySelector('#question');
    const answer = document.querySelector('#answer');
    const counter = document.querySelector('#counter');
    const score = document.querySelector('#score');
    const progress = document.querySelector('#progress');

    function render() {
      const index = order[position];
      card.classList.remove('flipped');
      question.textContent = cards[index][0];
      answer.textContent = cards[index][1];
      counter.textContent = `Card ${position + 1} of ${cards.length}`;
      const known = Object.values(results).filter(value => value === 'known').length;
      const review = Object.values(results).filter(value => value === 'review').length;
      score.textContent = `${known} known · ${review} review`;
      progress.style.width = `${((known + review) / cards.length) * 100}%`;
    }
    function move(amount) { position = (position + amount + cards.length) % cards.length; render(); }
    function mark(value) { results[order[position]] = value; localStorage.setItem('react-flashcard-progress', JSON.stringify(results)); move(1); }
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    document.querySelector('#previous').addEventListener('click', () => move(-1));
    document.querySelector('#next').addEventListener('click', () => move(1));
    document.querySelector('#known').addEventListener('click', () => mark('known'));
    document.querySelector('#review').addEventListener('click', () => mark('review'));
    document.querySelector('#shuffle').addEventListener('click', () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } position = 0; render(); });
    document.querySelector('#reset').addEventListener('click', () => { Object.keys(results).forEach(key => delete results[key]); localStorage.removeItem('react-flashcard-progress'); order = cards.map((_, index) => index); position = 0; render(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
      if (event.key === ' ') { event.preventDefault(); card.classList.toggle('flipped'); }
      if (event.key === '1') mark('review');
      if (event.key === '2') mark('known');
    });
    render();
  </script>
</body>
</html>
