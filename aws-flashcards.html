<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive AWS study flashcards.">
  <title>AWS Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#172033; --muted:#677087; --paper:#fff; --line:#dfe4ed; --orange:#ff9900; --navy:#192d49; --blue:#2774c9; --green:#16835f; --red:#c24b4b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:Manrope,sans-serif; background:radial-gradient(circle at 8% 12%,#fff2d6 0,transparent 28%),radial-gradient(circle at 90% 80%,#e1efff 0,transparent 30%),#f5f7fb; }
    button { font:inherit; }
    .topbar { height:68px; padding:0 max(22px,5vw); display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(23,32,51,.1); background:rgba(255,255,255,.82); backdrop-filter:blur(14px); }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-weight:800; text-decoration:none; }
    .mark { width:34px; height:34px; display:grid; place-items:center; border-radius:9px; color:white; background:var(--navy); box-shadow:inset 0 -4px 0 var(--orange); }
    .back { color:var(--muted); font-size:.9rem; text-decoration:none; }
    main { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:54px 0 70px; }
    .eyebrow { margin:0 0 8px; color:#b56b00; font:500 .76rem DM Mono,monospace; letter-spacing:.16em; text-transform:uppercase; }
    h1 { margin:0; font:700 clamp(2.4rem,7vw,4.8rem)/.95 Newsreader,serif; letter-spacing:-.04em; }
    .intro { margin:14px 0 30px; color:var(--muted); }
    .status { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:12px; color:var(--muted); font-size:.88rem; }
    .progress-track { height:7px; overflow:hidden; border-radius:99px; background:#e1e6ef; }
    .progress { height:100%; width:0; background:linear-gradient(90deg,var(--orange),#ffbd4d); transition:width .25s; }
    .card-wrap { perspective:1400px; margin:22px 0; }
    .card { width:100%; height:360px; position:relative; border:0; padding:0; cursor:pointer; background:transparent; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.75,.25,1); }
    .card.flipped { transform:rotateY(180deg); }
    .face { position:absolute; inset:0; padding:clamp(28px,6vw,64px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; backface-visibility:hidden; border:1px solid var(--line); border-radius:28px; background:var(--paper); box-shadow:0 24px 70px rgba(37,50,75,.12); }
    .back-face { transform:rotateY(180deg); background:linear-gradient(145deg,#162b47,#223f65); color:white; border-color:#29486f; }
    .label { position:absolute; top:24px; font:500 .72rem DM Mono,monospace; letter-spacing:.15em; text-transform:uppercase; color:var(--blue); }
    .back-face .label { color:#ffbd4d; }
    .face p { margin:0; max-width:720px; font:600 clamp(1.3rem,3.4vw,2rem)/1.38 Manrope,sans-serif; }
    .hint { position:absolute; bottom:20px; color:#8a93a6; font-size:.75rem; }
    .back-face .hint { color:#b8c8db; }
    .controls { display:grid; grid-template-columns:1fr auto auto 1fr; gap:10px; }
    .control { min-height:48px; padding:10px 18px; border:1px solid var(--line); border-radius:13px; color:var(--ink); background:white; cursor:pointer; font-weight:700; }
    .control:hover { border-color:#aeb8c8; transform:translateY(-1px); }
    .control.primary { color:white; border-color:var(--navy); background:var(--navy); }
    .study-actions { display:flex; justify-content:center; gap:10px; margin-top:12px; }
    .study-actions button { min-width:145px; }
    .review { color:var(--red); }
    .known { color:var(--green); }
    .footer-note { margin-top:28px; text-align:center; color:var(--muted); font-size:.78rem; }
    @media (max-width:620px) { main{padding-top:36px}.card{height:390px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1;grid-row:1}.study-actions button{min-width:0;flex:1}.topbar{padding:0 18px} }
    @media (prefers-reduced-motion:reduce) { *{scroll-behavior:auto!important}.card{transition:none} }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><span class="mark">A</span><span>AWS Study Deck</span></a>
    <a class="back" href="index.html">← Back to library</a>
  </header>
  <main>
    <p class="eyebrow">Cloud Practitioner revision</p>
    <h1>AWS flashcards</h1>
    <p class="intro">Flip each card to reveal the answer, then mark what you know. Your progress stays in this browser.</p>
    <div class="status"><span id="counter">Card 1 of 75</span><span id="score">0 known · 0 review</span></div>
    <div class="progress-track" aria-label="Deck progress"><div class="progress" id="progress"></div></div>
    <div class="card-wrap">
      <button class="card" id="card" type="button" aria-label="Flip flashcard" aria-live="polite">
        <span class="face front-face"><span class="label">Question</span><p id="question"></p><span class="hint">Click or press Space to reveal</span></span>
        <span class="face back-face"><span class="label">Answer</span><p id="answer"></p><span class="hint">Click or press Space to return</span></span>
      </button>
    </div>
    <div class="controls">
      <button class="control" id="previous" type="button">← Previous</button>
      <button class="control" id="shuffle" type="button">Shuffle</button>
      <button class="control" id="reset" type="button">Reset</button>
      <button class="control primary" id="next" type="button">Next →</button>
    </div>
    <div class="study-actions">
      <button class="control review" id="review" type="button">Needs review</button>
      <button class="control known" id="known" type="button">I know this</button>
    </div>
    <p class="footer-note">Keyboard: ← previous · → next · Space flip · 1 review · 2 known</p>
  </main>

  <script id="deck-data" type="application/json"></script>
  <script>
    const cards = [
      ["Amazon EC2","Provides secure, resizable compute capacity in the cloud via virtual servers."],
      ["AWS Lambda","A serverless compute service that runs code in response to events without managing servers."],
      ["Amazon S3","An object storage service offering industry-leading scalability, data availability, and security."],
      ["Amazon Aurora","A MySQL and PostgreSQL-compatible relational database built for the cloud."],
      ["Amazon DynamoDB","A fully managed NoSQL database service that provides fast and predictable performance with seamless scalability."],
      ["Amazon RDS","A service that makes it easy to set up, operate, and scale a relational database in the cloud."],
      ["Amazon VPC","Enables the provisioning of a logically isolated section of the AWS Cloud to launch resources in a virtual network."],
      ["Amazon Route 53","A highly available and scalable cloud Domain Name System (DNS) web service."],
      ["Amazon CloudFront","A fast content delivery network (CDN) service that securely delivers data, videos, and APIs globally."],
      ["AWS IAM","Enables secure management of access to AWS services and resources by creating users and groups."],
      ["AWS Key Management Service (KMS)","A managed service that makes it easy to create and control the cryptographic keys used to encrypt data."],
      ["AWS Shield","A managed Distributed Denial of Service (DDoS) protection service that safeguards applications."],
      ["AWS WAF","A web application firewall that helps protect web applications from common web exploits."],
      ["Amazon GuardDuty","A threat detection service that continuously monitors for malicious activity and unauthorized behavior."],
      ["Amazon Inspector","An automated security assessment service that helps improve the security and compliance of applications."],
      ["AWS Trusted Advisor","An online tool that provides real-time guidance to help provision resources following AWS best practices."],
      ["AWS CloudTrail","A service that enables governance, compliance, operational auditing, and risk auditing of your AWS account."],
      ["Amazon CloudWatch","A monitoring and observability service built for DevOps engineers, developers, and IT managers."],
      ["AWS Config","A service that enables you to assess, audit, and evaluate the configurations of your AWS resources."],
      ["AWS Artifact","A central resource for compliance-related information and on-demand access to AWS's security and compliance reports."],
      ["AWS Budgets","Allows users to set custom budgets that alert them when costs or usage exceed their budgeted amount."],
      ["AWS Cost Explorer","A tool that enables users to visualize, understand, and manage their AWS costs and usage over time."],
      ["AWS Organizations","Helps centrally manage and govern an environment as accounts grow and scale, including consolidated billing."],
      ["AWS Pricing Calculator","A web-based planning tool to estimate the cost for your architecture solution on AWS."],
      ["Amazon SNS","A fully managed pub/sub messaging service for high-throughput system-to-system and person-to-person communication."],
      ["Amazon SQS","A fully managed message queuing service that enables you to decouple and scale microservices and distributed systems."],
      ["AWS CloudFormation","Allows you to model and set up your AWS resources using infrastructure as code templates."],
      ["AWS Elastic Beanstalk","A service for deploying and scaling web applications developed with Java, .NET, PHP, Node.js, and more."],
      ["Amazon ElastiCache","A fully managed in-memory data store and cache service supporting Memcached or Redis."],
      ["Amazon Athena","An interactive query service that makes it easy to analyze data in Amazon S3 using standard SQL."],
      ["AWS Glue","A serverless data integration service that makes it easy to discover, prepare, and combine data for analytics."],
      ["Amazon SageMaker AI","A managed service for building, training, and deploying machine learning models."],
      ["AWS Secrets Manager","Helps protect secrets needed to access applications, services, and IT resources."],
      ["Amazon Macie","A data security and privacy service that uses machine learning to discover and protect sensitive data."],
      ["AWS Direct Connect","Establishes a dedicated network connection from your premises to AWS."],
      ["AWS Fargate","A serverless compute engine for containers that works with Amazon ECS and Amazon EKS."],
      ["Amazon EBS","Provides high-performance block storage volumes for use with Amazon EC2 instances."],
      ["Amazon EFS","A simple, scalable, fully managed cloud-native NFS file system."],
      ["AWS Storage Gateway","A hybrid cloud storage service providing on-premises access to cloud storage."],
      ["AWS Snowball","A petabyte-scale physical-device solution for transferring data into and out of AWS."],
      ["AWS Backup","A fully managed backup service for centralizing and automating backups across AWS services."],
      ["AWS Database Migration Service (DMS)","Migrates databases to AWS securely while the source database remains operational."],
      ["Amazon Rekognition","Adds image and video analysis to applications using deep learning technology."],
      ["Amazon Lex","Builds conversational interfaces using voice and text."],
      ["Amazon Polly","Turns text into lifelike speech."],
      ["Who secures AWS physical infrastructure?","AWS."],
      ["Who configures security groups and network ACLs?","The customer."],
      ["Which Well-Architected pillar covers correct and consistent workload operation?","Reliability."],
      ["Which pillar focuses on efficient use of computing resources?","Performance Efficiency."],
      ["What is the main cloud economy-of-scale benefit?","Lower pay-as-you-go prices due to AWS's massive customer base."],
      ["What is scaling resources up and down with fluctuating demand called?","Elasticity."],
      ["What is the Principle of Least Privilege?","Grant only the minimum permissions required to complete a task."],
      ["What is an AWS Region?","A physical location where AWS clusters data centers."],
      ["What is an AWS Availability Zone?","One or more discrete data centers with redundant power, networking, and connectivity in an AWS Region."],
      ["What are Edge Locations used for?","Caching content closer to end users for lower latency through services such as CloudFront."],
      ["Lowest AWS Support plan with all Trusted Advisor checks?","Business Support."],
      ["What does the AWS Health Dashboard do?","Provides alerts and remediation guidance for AWS events that may affect you."],
      ["Which service centrally manages billing and access for multiple AWS accounts?","AWS Organizations."],
      ["What is AWS Shield Advanced primarily for?","Enhanced DDoS protection and 24/7 access to the AWS Shield Response Team."],
      ["Amazon SES","A flexible, scalable email service for sending mail from applications."],
      ["Amazon Connect","An omnichannel cloud contact center service."],
      ["Which pricing model discounts a 1- or 3-year compute-spend commitment?","AWS Savings Plans."],
      ["What is an EC2 Spot Instance?","Unused EC2 capacity offered at a discount that AWS can reclaim with a two-minute notice."],
      ["What is the AWS Cloud Adoption Framework (CAF)?","A framework for developing and executing efficient cloud migration plans."],
      ["Where can you find and deploy third-party software running on AWS?","AWS Marketplace."],
      ["Who patches physical host hardware under shared responsibility?","AWS."],
      ["What does AWS KMS do?","Lets customers create and manage keys used to encrypt or digitally sign data."],
      ["Which tool interacts with AWS services through command-line scripts?","AWS CLI."],
      ["What is the first AWS account identity with full resource access?","The root user."],
      ["What is Amazon Cognito primarily used for?","Authentication, authorization, and user management for web and mobile apps."],
      ["Which service monitors and audits AWS API calls?","AWS CloudTrail."],
      ["AWS Glue","A serverless data integration service for discovering, preparing, and combining analytics data."],
      ["What is right sizing?","Matching resource types and sizes to workload requirements at the lowest practical cost."],
      ["Which pillar minimizes workload environmental impact?","Sustainability."],
      ["Amazon WorkSpaces","A managed, secure Desktop-as-a-Service solution accessible from many devices."]
    ];

    let order = cards.map((_, index) => index);
    let position = 0;
    const results = JSON.parse(localStorage.getItem('aws-flashcard-progress') || '{}');
    const card = document.querySelector('#card');
    const question = document.querySelector('#question');
    const answer = document.querySelector('#answer');
    const counter = document.querySelector('#counter');
    const score = document.querySelector('#score');
    const progress = document.querySelector('#progress');

    function render() {
      const index = order[position];
      card.classList.remove('flipped');
      question.textContent = cards[index][0];
      answer.textContent = cards[index][1];
      counter.textContent = `Card ${position + 1} of ${cards.length}`;
      const known = Object.values(results).filter(value => value === 'known').length;
      const review = Object.values(results).filter(value => value === 'review').length;
      score.textContent = `${known} known · ${review} review`;
      progress.style.width = `${((known + review) / cards.length) * 100}%`;
    }
    function move(amount) { position = (position + amount + cards.length) % cards.length; render(); }
    function mark(value) { results[order[position]] = value; localStorage.setItem('aws-flashcard-progress', JSON.stringify(results)); move(1); }
    card.addEventListener('click', () => card.classList.toggle('flipped'));
    document.querySelector('#previous').addEventListener('click', () => move(-1));
    document.querySelector('#next').addEventListener('click', () => move(1));
    document.querySelector('#known').addEventListener('click', () => mark('known'));
    document.querySelector('#review').addEventListener('click', () => mark('review'));
    document.querySelector('#shuffle').addEventListener('click', () => { for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } position = 0; render(); });
    document.querySelector('#reset').addEventListener('click', () => { Object.keys(results).forEach(key => delete results[key]); localStorage.removeItem('aws-flashcard-progress'); order = cards.map((_, index) => index); position = 0; render(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
      if (event.key === ' ') { event.preventDefault(); card.classList.toggle('flipped'); }
      if (event.key === '1') mark('review');
      if (event.key === '2') mark('known');
    });
    render();
  </script>
</body>
</html>
